name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint & validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: ./scripts
          severity: warning

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Ruff
        uses: astral-sh/ruff-action@v3

      - name: Syntax-check Python
        run: python -m py_compile scripts/research_engine.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate plugin manifest
        run: claude plugin validate . --strict

      - name: Plugin, versions and frontmatter agree
        # validate --strict only reads the marketplace manifest. This is the check
        # that reads the repo the way Claude Code does: it fails on a skill whose
        # frontmatter the loader cannot parse (two of boote's did, and shipped with
        # no metadata at all) and on a plugin.json version that disagrees with the
        # marketplace entry. --dry-run creates nothing.
        run: claude plugin tag --dry-run .
